<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Title</title>
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
    <!-- Header -->
    <div id="header">
        <!-- Include header component -->
        <!-- Example: <include src="../components/header.html"></include> -->
    </div>

    <div class="container mt-5">
        <h1 class="mb-4">Blog Post Title</h1>
        <p class="text-muted">By Author Name on Date</p>
        <div class="post-content">
            <p>This is where the content of the blog post will go. You can include text, images, and other media here.</p>
        </div>

        <hr>

        <h3>Comments</h3>
        <div class="comments-section">
            <form>
                <div class="form-group">
                    <label for="comment">Leave a comment:</label>
                    <textarea class="form-control" id="comment" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
            <div class="comments-list mt-3">
                <!-- Example comment -->
                <div class="comment">
                    <p><strong>Commenter Name:</strong> This is a sample comment.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer">
        <!-- Include footer component -->
        <!-- Example: <include src="../components/footer.html"></include> -->
    </div>

    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
</body>
</html>
